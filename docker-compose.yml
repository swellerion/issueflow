services:
  postgres:
    image: postgres:17-alpine
    container_name: issueflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: issueflow
      POSTGRES_PASSWORD: issueflow
      POSTGRES_DB: issueflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
